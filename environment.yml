# TaeGO 1.1.0 validated Linux x86_64 runtime.
# Create a named environment with:
#   micromamba create -n taego-1.1.0 -f environment.yml -y
# These are the direct runtime pins; the solver resolves their dependencies.
channels:
  - conda-forge
  - bioconda

dependencies:
  - r-base=4.4.1
  - bioconductor-clusterprofiler=4.14.0
  - bioconductor-go.db=3.20.0
  - r-dplyr=1.2.1
  - bioconductor-org.hs.eg.db=3.20.0
  - bioconductor-org.mm.eg.db=3.20.0
  - bioconductor-annotationdbi=1.68.0
  - bioconductor-genomeinfodbdata=1.2.13
