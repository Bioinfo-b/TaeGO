name: Bug report
description: Report a reproducible TaeGO problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not upload private data or credentials.
  - type: input
    id: version
    attributes:
      label: TaeGO version
      description: Run `taego -v` and paste the result.
      placeholder: "TaeGO 1.1.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command that failed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and diagnostics
      description: Include the complete error and, if possible, `taego info` and `taego doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, installation method, and any relevant details.
    validations:
      required: true
